name: CI - Tests & SonarCloud

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test-and-sonar:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run tests and generate coverage
        run: |
          # Ajusta este comando si usas otro runner/test command
          npm test -- --coverage || true
          # Mostrar reportes para debug
          ls -la coverage || true
          if [ -f coverage/lcov.info ]; then echo "lcov found"; else echo "WARNING: coverage/lcov.info not found"; fi

      - name: SonarCloud Scan
        uses: sonarsource/sonarcloud-github-action@v3
        with:
          args: >
            -Dsonar.organization=YOUR_SONARCLOUD_ORG
            -Dsonar.projectKey=YOUR_SONARCLOUD_PROJECTKEY
            -Dsonar.sources=src
            -Dsonar.tests=src
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
            -Dsonar.exclusions=**/node_modules/**,**/dist/**,**/build/**
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
