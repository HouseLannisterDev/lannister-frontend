name: Build

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - develop
    types: [opened, synchronize, reopened]

jobs:
  analyze:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest

    steps:
      # 1. Descarga el código
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Requerido por Sonar

      # 2. Configura Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '23'
          cache: 'npm'
          cache-dependency-path: frontend/server/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./frontend/server

# 4. (NUEVO) Configura Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10' # O la versión que uses

      # 5. (NUEVO) Instala dependencias de Python
      #    (Asume que 'requirements.txt' está en la raíz)
          

      # 4. SonarCloud Scan
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # ¡CAMBIO 3! - Ejecuta el scanner dentro de la carpeta correcta
        
        with:
          args: >
            -Dsonar.organization=lannisternews
            -Dsonar.projectKey=HouseLannisterDev_lannister-frontend
            -Dsonar.projectBaseDir=frontend/server
            -Dsonar.sources="."
            -Dsonar.javascript.package.json=frontend/server/package.json
