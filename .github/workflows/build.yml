name: Analyze Frontend (SonarCloud)

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
    types: [opened, synchronize, reopened]

jobs:
  analyze:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest

    steps:
      # 1. Descarga el código
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Requerido por Sonar

      # 2. Configura Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '23'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        working-directory: ./frontend/server

      # 4. ¡Este es el 'action' correcto para SonarCloud!
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master # <-- CAMBIO 1
        env:
          # Este token lo creaste en SonarCloud
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          # Este token es automático y necesario para los Pull Requests
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # <-- CAMBIO 2 (Añadido)
        with:
          args: >
            -Dsonar.organization=lannisternews
            -Dsonar.projectKey=HouseLannisterDev_lannister-frontend
            -Dsonar.sources=src
